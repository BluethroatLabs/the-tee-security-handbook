<svg xmlns="http://www.w3.org/2000/svg" width="420" height="538" viewBox="0 0 420 538" role="img" aria-labelledby="title description">
  <title id="title">Required evidence across protocol steps</title>
  <desc id="description">An accepted protocol step must advance required enclave state, make successor evidence available, and allow the successor operation to validate that evidence before progress continues.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
  </defs>
  <rect width="420" height="538" rx="16" fill="#f8fafc"/>
  <g fill="#eff6ff" stroke="#1e40af" stroke-width="2">
    <rect x="32" y="24" width="356" height="68" rx="10"/>
    <rect x="32" y="128" width="356" height="68" rx="10"/>
    <rect x="32" y="232" width="356" height="68" rx="10"/>
    <rect x="32" y="336" width="356" height="68" rx="10"/>
    <rect x="32" y="440" width="356" height="68" rx="10"/>
  </g>
  <g fill="none" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M210 94 V120"/>
    <path d="M210 198 V224"/>
    <path d="M210 302 V328"/>
    <path d="M210 406 V432"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <text x="210" y="64">Accepted protocol step</text>
    <text x="210" y="156">Required enclave</text>
    <text x="210" y="180">state update</text>
    <text x="210" y="260">Evidence for the</text>
    <text x="210" y="284">successor step</text>
    <text x="210" y="364">Successor operation</text>
    <text x="210" y="388">validates evidence</text>
    <text x="210" y="480">Protocol continues</text>
  </g>
</svg>
